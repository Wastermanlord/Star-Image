name: Build
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Instalar dependencias base
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm rustup \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg

      - uses: actions/checkout@v4

      - name: Configurar Rust
        run: |
          rustup default stable

      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.AppImage

  build-other:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pattern: "*.exe,*.msi"
          - os: macos-latest
            target: aarch64-apple-darwin
            pattern: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm install
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/${{ matrix.pattern }}
