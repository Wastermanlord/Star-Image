name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: UBUNTU - Genera el AppImage Universal
  # ==========================================
  build-ubuntu-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ==========================================
  # JOB 2: ARCH LINUX - Genera paquete nativo .pkg.tar.zst
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base y preparar usuario builder
        run: |
          pacman -Syu --noconfirm
          # CAMBIO: Quitamos nodejs/npm de pacman, añadimos python para node-gyp
          pacman -S --noconfirm base-devel git cmake sudo python curl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg pacman-contrib rust cargo

          # Fix locale
          echo "LANG=en_US.UTF-8" >> /etc/locale.conf

          # Crear usuario builder para makepkg (makepkg no permite root)
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # CAMBIO CRÍTICO: Usar la acción de Node asegura la misma versión que Ubuntu y_cachea npm!
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/bin/
            /home/builder/.cargo/registry/index/
            /home/builder/.cargo/registry/cache/
            /home/builder/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Arreglar permisos para builder
        run: |
          # Asegurar que builder pueda escribir en el workspace y en los caches
          chown -R builder:builder $GITHUB_WORKSPACE
          chown -R builder:builder /home/builder
          mkdir -p /home/builder/.npm
          chown -R builder:builder /home/builder/.npm

      - name: Compilar Tauri y Crear Paquete Arch
        run: |
          cat <<SCRIPT > /tmp/build_script.sh
          #!/bin/bash
          set -e
          cd ${GITHUB_WORKSPACE}
          export LC_ALL=C
          # El PATH ya contiene Node v22 y Cargo gracias a los pasos anteriores
          export PATH="${PATH}:/home/builder/.cargo/bin"

          npm install
          npm run tauri build -- --no-bundle

          APP_NAME=\$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print \$2}')
          APP_VERSION=\$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print \$2}')
          BIN_NAME=\${APP_NAME//-/_}

          echo "========================================"
          echo "Nombre en Cargo.toml : \$APP_NAME"
          echo "Nombre del binario   : \$BIN_NAME"
          echo "Versión              : \$APP_VERSION"
          echo "========================================"

          PKG_DIR=/tmp/arch-pkg
          mkdir -p \$PKG_DIR/src

          cp src-tauri/target/release/\$BIN_NAME \$PKG_DIR/src/\$BIN_NAME

          cat <<PKGBUILDEOF > \$PKG_DIR/PKGBUILD
          pkgname=\$APP_NAME
          pkgver=\$APP_VERSION
          pkgrel=1
          pkgdesc="Aplicación Tauri"
          arch=('x86_64')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'openssl' 'librsvg')
          source=("\$BIN_NAME")
          noextract=("\$BIN_NAME")

          package() {
              install -Dm755 "\\$srcdir/\$BIN_NAME" "\\$pkgdir/usr/bin/\$APP_NAME"
          }
          PKGBUILDEOF

          cd \$PKG_DIR
          makepkg -sf --noconfirm --skipinteg

          mkdir -p ${GITHUB_WORKSPACE}/arch-dist
          cp *.pkg.tar.zst ${GITHUB_WORKSPACE}/arch-dist/
          SCRIPT

          chmod +x /tmp/build_script.sh
          chown builder:builder /tmp/build_script.sh

          su - builder -c "/tmp/build_script.sh"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst
