name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: UBUNTU - Genera el AppImage Universal
  # ==========================================
  build-ubuntu-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.AppImage

  # ==========================================
  # JOB 2: ARCH LINUX - Genera paquete nativo .pkg.tar.zst
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04 # Usamos runner de GH pero con contenedor Arch
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base (Arch)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm cmake \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg pacman-contrib

          # Arreglar permisos para build de pacman
          usermod -aG wheel root
          echo "root ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Configurar Rust
        run: |
          rustup default stable
          rustup update stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - run: npm install

      # IMPORTANTE: Build sin generar bundle de AppImage, solo el binario raw
      - name: Compilar binario Tauri
        run: npm run tauri build -- --no-bundle

      # Aquí crearemos un PKGBUILD dinámico para empaquetar el binario en formato Arch
      - name: Crear paquete Arch Linux (.pkg.tar.zst)
        run: |
          # Obtener nombre y versión desde Cargo.toml
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | sed 's/name = "//;s/"//')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | sed 's/version = "//;s/"//')

          # Preparar directorio de packaging
          mkdir -p /tmp/arch-pkg/src
          cp src-tauri/target/release/${APP_NAME} /tmp/arch-pkg/src/

          # Crear un PKGBUILD básico
          cat <<EOF > /tmp/arch-pkg/PKGBUILD
          pkgname=${APP_NAME}
          pkgver=${APP_VERSION}
          pkgrel=1
          pkgdesc="Aplicación Tauri"
          arch=('x86_64')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'openssl' 'librsvg')
          source=("\${APP_NAME}")
          package() {
              install -Dm755 "\${srcdir}/\${APP_NAME}" "\${pkgdir}/usr/bin/\${APP_NAME}"
          }
          EOF

          # Construir el paquete
          cd /tmp/arch-pkg
          makepkg -sf --noconfirm

          # Mover el resultado al directorio del repo para que la Release action lo encuentre
          mkdir -p $GITHUB_WORKSPACE/arch-dist
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/arch-dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst

  # ==========================================
  # JOB 3: WINDOWS & MACOS
  # ==========================================
  build-other:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            patterns: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            target: aarch64-apple-darwin
            patterns: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Instalar dependencias MacOS
        if: matrix.os == 'macos-latest'
        run: brew install librsvg
      - run: npm install
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: ${{ matrix.patterns }}
