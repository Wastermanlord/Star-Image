Entendido, bro. Fuera macOS. Si Proyecto Astral se enfoca en Windows y Linux, no
tiene sentido gastar minutos de build en servidores de Apple.

Aquí tienes el YAML limpio, solo con AppImage (Universal), Paquete Nativo Arch y
Windows (Exe/Msi):

name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: UBUNTU - AppImage (Compatibilidad General Linux)
  # ==========================================
  build-ubuntu-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  # ==========================================
  # JOB 2: ARCH LINUX - Paquete Nativo (.pkg.tar.zst)
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base Arch
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm cmake webkit2gtk-4.1 gtk3 libayatana-appindicator-gtk3 patchelf openssl librsvg pacman-contrib rust cargo sudo

      - name: Configurar usuario builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Compilar Binario Tauri
        shell: bash
        run: |
          sudo -u builder npm install
          sudo -u builder npm run tauri build -- --no-bundle

      - name: Crear paquete Arch Linux
        shell: bash
        run: |
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')

          mkdir -p package-dir
          cp src-tauri/target/release/${APP_NAME} package-dir/

          cat <<EOF > package-dir/PKGBUILD
          pkgname=${APP_NAME,,}
          pkgver=${APP_VERSION}
          pkgrel=1
          pkgdesc="Visor de imágenes ligero - Proyecto Astral"
          arch=('x86_64')
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator-gtk3' 'openssl' 'librsvg')
          source=("\${pkgname}")
          sha256sums=('SKIP')

          package() {
              install -Dm755 "\${srcdir}/\${pkgname}" "\${pkgdir}/usr/bin/\${pkgname}"
              mkdir -p "\${pkgdir}/usr/share/applications"
              cat <<EOT > "\${pkgdir}/usr/share/applications/\${pkgname}.desktop"
          [Desktop Entry]
          Name=Star Image
          Exec=\${pkgname}
          Icon=utilities-terminal
          Type=Application
          Categories=Graphics;Viewer;
          Terminal=false
          EOT
          }
          EOF

          chown -R builder:builder package-dir
          cd package-dir
          sudo -u builder makepkg -sf --noconfirm

          mkdir -p ../dist-arch
          cp *.pkg.tar.zst ../dist-arch/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-arch/*.pkg.tar.zst

  # ==========================================
  # JOB 3: WINDOWS - EXE y MSI
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

Cambios realizados:

1.  Eliminado el Job de MacOS: Ya no se ejecutará ni gastará recursos.
2.  Simplificado Job de Windows: Quité la matriz (matrix) ya que ahora solo
    compila para un objetivo, haciendo el código más limpio.
3.  Corrección de dependencias Arch: Aseguré que use
    libayatana-appindicator-gtk3 en el PKGBUILD, que es el nombre correcto del
    paquete en los repositorios de Arch.

Con esto, cada vez que hagas un push de un tag (como v1.0.2), GitHub te
generará:

  - El .AppImage para cualquier Linux.
  - El .pkg.tar.zst nativo para tu EndeavourOS.
  - El .exe y .msi para Windows.

¡A darle, bro! Avísame si la build de Arch pasa bien.
