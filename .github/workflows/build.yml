name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

# ==========================================
  # JOB 2: ARCH LINUX - Paquete Nativo (.pkg.tar.zst)
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake python curl sudo \
            webkit2gtk-4.1 gtk3 libayatana-appindicator-gtk3 patchelf \
            openssl librsvg pacman-contrib rust cargo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: npm install
      - run: npm run tauri build -- --no-bundle

      - name: Crear paquete Arch Linux (.pkg.tar.zst)
        run: |
          # 1. Extraer info real
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          # IMPORTANTE: Si el nombre tiene guiones, Cargo a veces usa guiones bajos en el binario
          BIN_NAME=${APP_NAME//-/_}

          # 2. Configurar usuario builder
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # 3. Crear carpeta de trabajo limpia en /home/builder
          WORK_DIR=/home/builder/build
          mkdir -p $WORK_DIR

          # Copiar el binario compilado allí (será nuestra "fuente")
          cp src-tauri/target/release/$BIN_NAME $WORK_DIR/$APP_NAME

          # 4. Crear PKGBUILD estándar
          cat <<EOF > $WORK_DIR/PKGBUILD
          pkgname='$APP_NAME'
          pkgver='$APP_VERSION'
          pkgrel=1
          pkgdesc="Aplicación del Proyecto Astral"
          arch=('x86_64')
          # Usamos el binario local como fuente
          source=("\$pkgname")
          sha256sums=('SKIP')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator-gtk3' 'openssl' 'librsvg')

          package() {
              # Makepkg pone las fuentes en \$srcdir
              install -Dm755 "\$srcdir/\$pkgname" "\$pkgdir/usr/bin/\$pkgname"
          }
          EOF

          # Dar permisos al usuario builder
          chown -R builder:builder $WORK_DIR

          # 5. Entrar y construir
          cd $WORK_DIR
          sudo -u builder makepkg -sf --noconfirm

          # 6. Sacar el archivo final al workspace de GitHub
          mkdir -p $GITHUB_WORKSPACE/arch-dist
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/arch-dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst
