name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: UBUNTU - Genera el AppImage Universal
  # ==========================================
  build-ubuntu-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - run: npm install
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ==========================================
  # JOB 2: ARCH LINUX - Genera paquete nativo .pkg.tar.zst
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base y preparar entorno (Arch)
        run: |
          # Forzar locale para que makepkg no falle con warnings de idioma
          echo "LANG=en_US.UTF-8" >> /etc/locale.conf
          echo "LC_ALL=en_US.UTF-8" >> /etc/environment
          export LC_ALL=en_US.UTF-8

          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm cmake \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg pacman-contrib rust cargo

          # Arreglar permisos para fakeroot (vital en contenedores Arch)
          echo "root ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          sed -i 's/# %wheel ALL=(ALL:ALL) NOPASSWD: ALL/%wheel ALL=(ALL:ALL) NOPASSWD: ALL/' /etc/sudoers

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - run: npm install

      - name: Compilar binario Tauri (Sin bundle)
        run: npm run tauri build -- --no-bundle

      - name: Crear paquete Arch Linux (.pkg.tar.zst)
        run: |
          # Extraer nombre y versión de Cargo.toml de forma segura
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')

          # Reemplazar guiones con underscores (Cargo compila binarios con underscores)
          BIN_NAME=${APP_NAME//-/_}

          echo "========================================"
          echo "Nombre de la app (Cargo.toml): $APP_NAME"
          echo "Nombre del binario compilado:   $BIN_NAME"
          echo "Versión:                        $APP_VERSION"
          echo "========================================"

          # Preparar directorio de packaging
          PKG_DIR=/tmp/arch-pkg
          mkdir -p $PKG_DIR/src

          # Copiar el binario compilado (usando el nombre con underscores)
          cp src-tauri/target/release/$BIN_NAME $PKG_DIR/src/$BIN_NAME

          # Crear un PKGBUILD dinámico y robusto
          cat <<EOF > $PKG_DIR/PKGBUILD
          pkgname=$APP_NAME
          pkgver=$APP_VERSION
          pkgrel=1
          pkgdesc="Aplicación Tauri"
          arch=('x86_64')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'openssl' 'librsvg')
          source=("$BIN_NAME")
          noextract=("$BIN_NAME")

          package() {
              install -Dm755 "\${srcdir}/\${source[0]}" "\${pkgdir}/usr/bin/\${pkgname}"
          }
          EOF

          # Construir el paquete como root (en contenedores no podemos crear un user build normal fácilmente)
          cd $PKG_DIR
          makepkg -sf --noconfirm --skipinteg

          # Mover el resultado al directorio de trabajo de GitHub
          mkdir -p $GITHUB_WORKSPACE/arch-dist
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/arch-dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst

  # ==========================================
  # JOB 3: WINDOWS
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: npm install
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
