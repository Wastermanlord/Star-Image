name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

  #==========================================
  # JOB 1: APPIMAGE - Linux general
  #==========================================
  build-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: appimage-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: appimage-cargo-

      - run: npm install

      - run: npm run tauri build

      - name: Firmar AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npx tauri signer sign -p "" \
            src-tauri/target/release/bundle/appimage/*.AppImage

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig

  #==========================================
  # JOB 2: ARCH LINUX - Paquete Nativo (.pkg.tar.zst)
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git cmake python curl sudo \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg pacman-contrib rust cargo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - run: npm install
      - run: npm run tauri build -- --no-bundle

      - name: Crear paquete Arch Linux (.pkg.tar.zst)
        run: |
          # 1. Extraer info
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          BIN_NAME=$APP_NAME

          # 2. Configurar el usuario 'builder'
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # 3. Preparar directorio de trabajo
          PKG_DIR=/home/builder/arch-pkg
          mkdir -p $PKG_DIR

          # COPIAR BINARIO E ICONO (Paso clave)
          cp src-tauri/target/release/$BIN_NAME $PKG_DIR/binario_app
          cp src-tauri/icons/128x128.png $PKG_DIR/app_icon.png

          # 4. Crear PKGBUILD
          cat <<EOF > $PKG_DIR/PKGBUILD
          pkgname='$APP_NAME'
          pkgver='$APP_VERSION'
          pkgrel=1
          pkgdesc="Visor de imágenes ligero - Proyecto Astral"
          arch=('x86_64')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'openssl' 'librsvg')
          source=("binario_app" "app_icon.png")
          sha256sums=('SKIP' 'SKIP')

          package() {
              # 1. Instalar el binario
              install -Dm755 "\$srcdir/binario_app" "\$pkgdir/usr/bin/\$pkgname"

              # 2. Instalar el icono en la ruta del sistema
              install -Dm644 "\$srcdir/app_icon.png" "\$pkgdir/usr/share/icons/hicolor/128x128/apps/\$pkgname.png"

              # 3. Crear el acceso directo apuntando al icono
              mkdir -p "\$pkgdir/usr/share/applications"
              cat <<EOT > "\$pkgdir/usr/share/applications/\$pkgname.desktop"
          [Desktop Entry]
          Name=Star Image
          Comment=Visor de imágenes rápido y ligero
          Exec=\$pkgname
          Icon=\$pkgname
          Type=Application
          Categories=Graphics;Viewer;
          Terminal=false
          EOT
          }
          EOF

          # Cambiar dueño al usuario builder
          chown -R builder:builder $PKG_DIR

          # 5. Ejecutar makepkg
          cd $PKG_DIR
          sudo -u builder makepkg -sf --noconfirm --skipinteg

          # 6. Mover el resultado
          mkdir -p $GITHUB_WORKSPACE/arch-dist
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/arch-dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst

  #==========================================
  # JOB 3: WINDOWS - Instalador (.exe)
  #==========================================
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - run: npm install

      - run: npm run tauri build

      - name: Firmar instalador Windows
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npx tauri signer sign -p "" \
            src-tauri/target/release/bundle/nsis/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.sig

  #==========================================
  # JOB 4: UPDATER JSON - Firma para auto-updates
  #==========================================
  generate-updater-json:
    needs: [build-appimage, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descargar signatures del release
        run: |
          gh release download "${{ github.ref_name }}" --pattern "*.sig" --dir ./assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generar updater.json
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | awk -F '"' '{print $4}')

          LINUX_SIG=$(cat ./assets/*.AppImage.sig 2>/dev/null || cat ./assets/linux-x86_64.sig 2>/dev/null || echo "")
          WINDOWS_SIG=$(cat ./assets/*.exe.sig 2>/dev/null || cat ./assets/*.msi.sig 2>/dev/null || echo "")

          jq -n \
            --arg version "$VERSION" \
            --arg linux_sig "$LINUX_SIG" \
            --arg windows_sig "$WINDOWS_SIG" \
            --arg tag "${{ github.ref_name }}" \
            '{
              version: $version,
              notes: "",
              pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              platforms: {
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: ("https://github.com/Wastermanlord/Star-Image/releases/download/" + $tag + "/Star.Image_" + $version + "_amd64.AppImage")
                },
                "windows-x86_64": {
                  signature: $windows_sig,
                  url: ("https://github.com/Wastermanlord/Star-Image/releases/download/" + $tag + "/Star.Image_" + $version + "_x64-setup.exe")
                }
              }
            }' > updater.json

          echo "=== updater.json ==="
          cat updater.json

      - name: Subir updater.json al release
        run: |
          gh release upload "${{ github.ref_name }}" updater.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
