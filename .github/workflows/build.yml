name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

# ==========================================
  # JOB 2: ARCH LINUX - Genera paquete nativo .pkg.tar.zst
  # ==========================================
  build-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake python curl sudo \
            webkit2gtk-4.1 gtk3 libayatana-appindicator patchelf \
            openssl librsvg pacman-contrib rust cargo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - run: npm install
      - run: npm run tauri build -- --no-bundle

      - name: Crear paquete Arch Linux (.pkg.tar.zst)
        run: |
          # 1. Extraer info
          APP_NAME=$(grep '^name' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          APP_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          BIN_NAME=${APP_NAME//-/_}

          # 2. Configurar el usuario 'builder' (Indispensable para makepkg)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # 3. Preparar directorio de trabajo con permisos para el usuario
          PKG_DIR=/home/builder/arch-pkg
          mkdir -p $PKG_DIR/pkg/usr/bin

          # Copiar binario y dar propiedad al usuario builder
          install -Dm755 src-tauri/target/release/$BIN_NAME $PKG_DIR/pkg/usr/bin/$APP_NAME

          # 4. Crear PKGBUILD
          cat <<EOF > $PKG_DIR/PKGBUILD
          pkgname=$APP_NAME
          pkgver=$APP_VERSION
          pkgrel=1
          pkgdesc="Aplicación Tauri - Proyecto Astral"
          arch=('x86_64')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'openssl' 'librsvg')
          package() {
              cp -r \$srcdir/../pkg/usr \$pkgdir/
          }
          EOF

          # Cambiar dueño de toda la carpeta de construcción
          chown -R builder:builder $PKG_DIR

          # 5. Ejecutar makepkg como usuario 'builder'
          cd $PKG_DIR
          sudo -u builder makepkg -sf --noconfirm --skipinteg

          # 6. Mover el resultado de vuelta al workspace de GitHub
          mkdir -p $GITHUB_WORKSPACE/arch-dist
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/arch-dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            arch-dist/*.pkg.tar.zst
